services:
  nextcloud:
    image: kefaslungu/hng-nextcloud:latest
    container_name: hng-nextcloud
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app
    volumes:
      - nextcloud-data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: hng-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - "80:80"
    networks:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx

  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./detector:/app/detector
      - HNG-nginx-logs:/var/log/nginx:ro
    environment:
      - DETECTOR_CONFIG=/app/detector/config.yaml

networks:
  app:
    driver: bridge

volumes:
  nextcloud-data:
  HNG-nginx-logs:
